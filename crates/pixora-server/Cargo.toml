[package]
name = "pixora-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pixora 单二进制入口：路由、中间件、handler、静态资源"

# 编译产物就叫 pixora。容器里的 /pixora、发行包里的 pixora/、systemd 的 ExecStart、
# 排障时敲的命令，全按这个名字写；包名保持 pixora-server，是为了和其余 pixora-*
# 库 crate 排在一起时一眼看出哪个是入口。不写这段，文件名会跟着包名走。
[[bin]]
name = "pixora"
path = "src/main.rs"

[features]
default = ["embed-web"]
# 把 web/dist 打进二进制；关掉后从 PIXORA_WEB_DIR 读盘（前端联调更方便）
embed-web = []

[dependencies]
pixora-core.workspace = true
pixora-repo.workspace = true
pixora-storage.workspace = true
pixora-mail.workspace = true
pixora-queue.workspace = true
pixora-crypto.workspace = true

axum.workspace = true
axum-extra.workspace = true
tower.workspace = true
tower-http.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
http.workspace = true
http-body-util.workspace = true
bytes.workspace = true

serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
mimalloc.workspace = true
rust-embed.workspace = true
ipnet.workspace = true
percent-encoding.workspace = true
sqlx.workspace = true
reqwest.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true
