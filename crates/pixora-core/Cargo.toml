[package]
name = "pixora-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pixora 领域模型与业务服务"

[dependencies]
pixora-crypto.workspace = true
pixora-repo.workspace = true
pixora-storage.workspace = true
pixora-mail.workspace = true

tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures-util.workspace = true
tokio-util.workspace = true
image.workspace = true
governor.workspace = true
ipnet.workspace = true
reqwest.workspace = true
hickory-resolver.workspace = true
base64.workspace = true
hex.workspace = true
hmac.workspace = true
sha1.workspace = true

[target.'cfg(windows)'.dependencies]
# 读取 Windows「Internet 选项」里的用户级系统代理。reqwest 只认环境变量，
# 不读这里；不补这一步，「本机开了代理」对服务进程等于没开。
windows-registry = "0.6"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true
