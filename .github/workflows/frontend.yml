name: 前端静态站点

# 把前端产物发到静态托管上（Vercel / Cloudflare Pages / EdgeOne Makers / GitHub Pages）。
#
# 这个仓库的常态是「单二进制，前端嵌在二进制里」，所以这个 workflow 默认**不跑**：
# 只有当仓库变量 `PIXORA_DEPLOY_FRONTEND` 等于 `true`，或者你手动点一次时才会执行。
# 想用就先做两件事：
#
#   1. 变量：Settings → Variables → 新建 `PIXORA_DEPLOY_FRONTEND=true`，
#      再建一个 `PIXORA_API_BASE=https://img-api.example.com`（后端地址）。
#   2. 密钥：把下面用得到的平台凭据建好（用哪个建哪个，没建的平台自动跳过）：
#        CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID    Cloudflare Pages
#        VERCEL_TOKEN                                    Vercel
#        EDGEONE_API_TOKEN                               EdgeOne Makers
#      GitHub Pages 不需要凭据，仓库设置里把 Pages 的来源选成 GitHub Actions 即可。
#
# 前端与后端不同源时，后端那边要放行这个来源并把 Cookie 换成跨站模式：
#   PIXORA_CORS_ORIGINS=https://你的前端域名
# （详见 README 的「前后端分开部署」一节。）

on:
  workflow_dispatch:
    inputs:
      target:
        description: 发到哪儿
        type: choice
        default: all
        options: [all, cloudflare, vercel, edgeone, github-pages]
      api_base:
        description: 后端地址（留空则用仓库变量 PIXORA_API_BASE）
        required: false
  push:
    branches: [main, master]
    paths: ["web/**", ".github/workflows/frontend.yml"]

# GitHub Pages 那一步要用
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # 推送到主干时只有显式开了开关才走，免得给没配平台的仓库刷失败记录
    if: ${{ github.event_name == 'workflow_dispatch' || vars.PIXORA_DEPLOY_FRONTEND == 'true' }}
    runs-on: ubuntu-latest
    environment: frontend-static
    env:
      API_BASE: ${{ inputs.api_base || vars.PIXORA_API_BASE }}
      TARGET: ${{ inputs.target || 'all' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建前端
        working-directory: web
        run: |
          npm ci
          # PIXORA_API_BASE 会被构建脚本写进 dist/config.js；
          # 部署之后仍可直接改那个文件，不必重新构建
          PIXORA_API_BASE="$API_BASE" npm run build

      - name: 放入平台配置与运行时配置
        run: |
          cp deploy/static/_headers web/dist/
          cp deploy/static/config.js web/dist/config.js
          if [ -n "$API_BASE" ]; then
            printf 'window.__PIXORA__ = {"api_base": "%s"};\n' "${API_BASE%/}" > web/dist/config.js
          fi
          ls -la web/dist

      - name: 发到 Cloudflare Pages
        if: ${{ (env.TARGET == 'all' || env.TARGET == 'cloudflare') && secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy web/dist --project-name="${{ vars.CF_PAGES_PROJECT || 'pixora' }}" --branch="${{ github.ref_name }}"

      - name: 发到 Vercel
        if: ${{ (env.TARGET == 'all' || env.TARGET == 'vercel') && secrets.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          cp deploy/static/vercel.json web/dist/vercel.json
          npx --yes vercel@latest deploy web/dist --prod --yes --token "$VERCEL_TOKEN"

      - name: 发到 EdgeOne Makers
        if: ${{ (env.TARGET == 'all' || env.TARGET == 'edgeone') && secrets.EDGEONE_API_TOKEN != '' }}
        run: npx --yes edgeone@latest pages deploy web/dist -n "${{ vars.EDGEONE_PROJECT || 'pixora' }}" -t "${{ secrets.EDGEONE_API_TOKEN }}"

      - name: 准备 GitHub Pages
        if: ${{ env.TARGET == 'all' || env.TARGET == 'github-pages' }}
        run: |
          # GitHub Pages 没有 SPA 回落，只认 404.html：把它做成 index.html 的副本，
          # 陌生路径照样能进前端（路由由哈希接管）。
          # 反过来，Cloudflare Pages 一旦看见 404.html 就按真 404 处理，
          # 所以这一步只在发 Pages 时做，不能提前塞进产物
          cp web/dist/index.html web/dist/404.html

      - if: ${{ env.TARGET == 'all' || env.TARGET == 'github-pages' }}
        uses: actions/configure-pages@v5

      - if: ${{ env.TARGET == 'all' || env.TARGET == 'github-pages' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - id: pages
        if: ${{ env.TARGET == 'all' || env.TARGET == 'github-pages' }}
        uses: actions/deploy-pages@v4
        continue-on-error: true
