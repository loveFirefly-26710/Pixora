name: 发行版与镜像

# 版本号的唯一来源是 Cargo.toml 里 [workspace.package] 的 version
# （改版本号用 `sh scripts/bump-version.sh 0.2.0`，它会连 Cargo.lock 与
# web/package.json 一起改好；只想看看当前是多少就 `sh scripts/version.sh`）。
#
# 往主干推一次，这个工作流就按文件里的版本号办事：
#
#   1. 读出版本号，看 GitHub 上有没有这一版的 Release；
#   2. 没有 → 建标签 v<版本号>、出 Windows 与 Linux 可执行文件、发 Release；
#   3. 有   → 说明这一版早就发过了（改了代码没改版本号），跳过发版，
#             不会一推就多出一版；
#   4. 不论发不发版，都出容器镜像：发版那一趟带 :<版本号> 与 :latest，
#      平时带 :edge / :master / :sha-<短哈希>，给「想要主干最新代码」的人拉。
#
# 也可以手动跑（Actions → 发行版与镜像 → Run workflow）：
#   version 留空 = 用 Cargo.toml 里的；填一个新版本号 = 补发一版；
#   platforms 里加上 linux/arm64 就多出 ARM 镜像（走 QEMU 模拟，第一次很慢）。
#
# 首次推成功后，GHCR 上的包默认是私有的：想让别人不登录就能 docker pull，
# 去 Packages → 这个包 → Package settings → Change visibility → Public。

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（留空则用 Cargo.toml 里的）
        required: false
      platforms:
        description: 镜像架构
        required: false
        default: linux/amd64

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pixora
  PLATFORMS: ${{ inputs.platforms || 'linux/amd64' }}

jobs:
  # 先定版本号与「这一版要不要发」，后面的 job 都引用它
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - id: read
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          version=$(sh scripts/version.sh)
          if [ -z "$version" ]; then
            echo "::error::没从 Cargo.toml 读到版本号（看看 [workspace.package] 那一段）"
            exit 1
          fi

          # 手动触发按输入的版本号；推 v 标签时以标签为准，与文件不一致就提醒一句
          if [ -n "${INPUT_VERSION:-}" ]; then
            version="${INPUT_VERSION#v}"
          elif [ "$REF_TYPE" = "tag" ]; then
            if [ "v$version" != "$REF_NAME" ]; then
              echo "::warning::推的是标签 $REF_NAME，而 Cargo.toml 里写着 v$version；这次以标签为准"
            fi
            version="${REF_NAME#v}"
          fi
          tag="v$version"

          # 发没发过以 Release 为准（标签可能存在但还没发版）
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases/tags/$tag")
          if [ "$code" = "200" ]; then publish=false; else publish=true; fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

          {
            echo "## 本次运行"
            echo
            echo "- 版本号：\`$version\`（标签 \`$tag\`）"
            if [ "$publish" = "true" ]; then
              echo "- 发一版：这个版本还没有 Release"
            else
              echo "- 这一版已经发过，跳过二进制与 Release，只出镜像"
            fi
            echo "- 镜像架构：\`${PLATFORMS}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # 容器镜像：每次推送都出
  image:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只有要出 arm64 时才装 QEMU（模拟执行，慢）
      - uses: docker/setup-qemu-action@v3
        if: ${{ contains(env.PLATFORMS, 'arm64') }}
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GitHub 的校验器不允许在 if 里引用 secrets（写了整份文件就无效），
      # 所以「配没配密钥」在 run 里判断
      - name: 登录 Docker Hub（没配密钥就跳过）
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "没配 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，跳过（镜像照常推 GHCR）"
            exit 0
          fi
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: 选定镜像名
        id: targets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          {
            echo "list<<PIXORA_EOF"
            echo "$IMAGE"
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              echo "$DOCKERHUB_USERNAME/pixora"
            fi
            echo "PIXORA_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 生成标签与标注
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.targets.outputs.list }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=raw,value=${{ needs.meta.outputs.version }},enable=${{ needs.meta.outputs.publish == 'true' }}
            type=raw,value=latest,enable=${{ needs.meta.outputs.publish == 'true' }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pixora-image
          cache-to: type=gha,mode=max,scope=pixora-image

      - name: 镜像摘要
        run: |
          {
            echo "## 容器镜像"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "架构：\`${PLATFORMS}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # 推不上去时把原因挑明。最常见的一种：这个包名先前已被别的仓库建过
      # （仓库改过名，或者删了重建），当前仓库的令牌对那个旧包没有写权限。
      - name: 镜像没推出去时指出可能原因
        if: failure()
        run: |
          {
            echo "## 镜像没推出去"
            echo
            echo "如果报错里写着 permission_denied / write_package，多半是这个包名先前"
            echo "已经被别的仓库建过（改过名、删掉重建都算），当前仓库的令牌对它没有写权限。"
            echo
            echo "- 想干净重来：到 https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages"
            echo "  把这个包删掉，下一次运行会以当前仓库的身份重建；包默认私有，"
            echo "  想让人不登录就能 docker pull，在包的设置页改可见性。"
            echo "- 想留着旧包：在包的 Manage Actions access 里给当前仓库加上写权限。"
          } >> "$GITHUB_STEP_SUMMARY"

  # 下面两个 job 只在「这一版还没发过」时跑
  binaries:
    needs: meta
    if: needs.meta.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            packages: musl-tools
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            packages: ""
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 前端产物：仓库里提交了一份，这里重新构建一遍以保证与这份源码严格一致
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建前端
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 装 musl 工具链
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: 编译
        run: cargo build --release --target ${{ matrix.target }} -p pixora-server

      - name: 打包（Linux）
        if: matrix.archive == 'tar.gz'
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          mkdir -p dist/pixora
          cp target/${{ matrix.target }}/release/pixora dist/pixora/pixora
          cp README.md dist/pixora/ 2>/dev/null || true
          cp deploy/.env.example dist/pixora/ 2>/dev/null || true
          mkdir -p dist/pixora/deploy
          cp deploy/docker-compose.yml deploy/Caddyfile dist/pixora/deploy/ 2>/dev/null || true
          tar -czf "pixora-${TAG}-${{ matrix.name }}.tar.gz" -C dist pixora

      - name: 打包（Windows）
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force -Path dist/pixora | Out-Null
          Copy-Item target/${{ matrix.target }}/release/pixora.exe dist/pixora/pixora.exe
          if (Test-Path README.md) { Copy-Item README.md dist/pixora/ }
          if (Test-Path deploy/.env.example) { Copy-Item deploy/.env.example dist/pixora/ }
          New-Item -ItemType Directory -Force -Path dist/pixora/deploy | Out-Null
          if (Test-Path deploy/docker-compose.yml) { Copy-Item deploy/docker-compose.yml dist/pixora/deploy/ }
          if (Test-Path deploy/Caddyfile) { Copy-Item deploy/Caddyfile dist/pixora/deploy/ }
          Compress-Archive -Path dist/pixora -DestinationPath "pixora-${env:TAG}-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: pixora-${{ matrix.name }}
          path: |
            pixora-*.tar.gz
            pixora-*.zip
          retention-days: 7

  release:
    needs: [meta, binaries]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          # 只取两个可执行文件。同一趟运行里还挂着 buildx 的缓存产物
          # （<owner>~<repo>~<hash>.dockerbuild），它不是普通 zip，不过滤
          # 就会连它一起拉，下载重试五次后整个 job 失败。
          pattern: pixora-*
          path: artifacts
          merge-multiple: true

      - name: 算校验和
        run: |
          cd artifacts
          sha256sum pixora-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          # 标签不存在时它会按 target_commitish 创建（这个标签是机器人建的，
          # 不会反过来再触发一次工作流）
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Pixora ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/pixora-*.tar.gz
            artifacts/pixora-*.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            单文件发行版：解压即用，没有运行时依赖。

            | 文件 | 说明 |
            |---|---|
            | `pixora-*-linux-x86_64.tar.gz` | 静态链接（musl），任何 Linux 发行版都能跑 |
            | `pixora-*-windows-x86_64.zip` | Windows 10 / 11 |

            跑起来：

            ```bash
            # Linux
            tar -xzf pixora-*-linux-x86_64.tar.gz
            cd pixora && ./pixora
            ```

            ```powershell
            # Windows
            Expand-Archive pixora-*-windows-x86_64.zip .
            cd pixora\pixora; .\pixora.exe
            ```

            首次访问 <http://127.0.0.1:8080> 会进安装向导（环境检查 → 数据库 → 管理员 → 站点与邮件）。
            数据库默认用数据目录里的 SQLite；要换成 PostgreSQL / MySQL 就设
            `PIXORA_DB_DRIVER` 与 `PIXORA_DB_DSN`，详见 README 的部署章节。

            同一个提交也出了容器镜像（版本号与标签一致）：

            ```bash
            docker pull ghcr.io/lovefirefly-26710/pixora:latest
            ```
