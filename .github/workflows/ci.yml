name: CI

# 什么时候跑：往主干推、开 PR、以及手动点一次。
# 三件事各管一段——前端类型与构建、后端测试 + 端到端冒烟、Windows 上能不能编。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 依赖只编一次，跑测试与冒烟共用
  CARGO_INCREMENTAL: "0"

jobs:
  frontend:
    name: 前端（类型检查 + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 装依赖
        working-directory: web
        run: npm ci

      # esbuild 不做类型检查，所以 tsc 单独跑一遍：类型错在构建产物里是看不见的
      - name: 类型检查
        working-directory: web
        run: npx tsc --noEmit

      - name: 构建产物
        working-directory: web
        run: npm run build

      # 前端产物要嵌进二进制（rust-embed 在编译期读 web/dist），
      # 所以后端 job 直接用这一份，而不是仓库里提交的那份旧产物
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  backend:
    name: 后端（测试 + 冒烟）
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 单元与集成测试
        run: cargo test --workspace

      - name: 构建服务端
        run: cargo build -p pixora-server

      # 冒烟脚本用 `python` 这个命令名（Windows 上它叫 python，非 python3）
      - name: 备好 python 命令
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(command -v python3)" "$HOME/.local/bin/python"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 端到端冒烟
        run: |
          mkdir -p target/smoke
          PIXORA_DB_DRIVER=sqlite \
          PIXORA_DB_DSN=./target/smoke/pixora.db \
          PIXORA_DATA_DIR=./target/smoke \
          PIXORA_BIND=127.0.0.1:8099 \
          PIXORA_BASE_URL=http://127.0.0.1:8099 \
          ./target/debug/pixora-server > target/smoke/server.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8099/healthz > /dev/null; then break; fi
            sleep 1
          done
          bash scripts/smoke-new.sh

      - name: 失败时贴出服务端日志
        if: failure()
        run: tail -100 target/smoke/server.log

  windows:
    name: Windows（能编过）
    runs-on: windows-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 这一关只证明「Windows 上能编过」：磁盘容量探测、路径处理这些
      # `cfg(windows)` 分支在 Linux 上是编不到也测不到的
      - name: 全量检查
        run: cargo check --workspace --all-targets
