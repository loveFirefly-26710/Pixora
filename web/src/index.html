<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#2563eb" />
    <title>Pixora</title>
    <link rel="stylesheet" href="/main.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="app" class="app">
      <div class="pad" id="boot">
        <div class="skel" style="height: 40px; max-width: 320px; margin-top: 40px"></div>
      </div>
    </div>
    <noscript>Pixora 需要启用 JavaScript 才能使用。</noscript>
    <!-- 运行时配置：默认同源；把前端放到 Vercel / Cloudflare Pages / EdgeOne
         这类静态托管上时，改这个文件里的 api_base 指向后端即可 -->
    <script src="/config.js"></script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
