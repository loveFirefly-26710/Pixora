<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#040c0e" />
    <title>Pixora</title>
    <script>
      // 首绘前定主题：保存过用手动选择，否则跟随系统；避免深色用户先看到一帧白屏。
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem("pixora-theme");
        } catch {
          /* 存储不可用时按系统走 */
        }
        const theme =
          saved === "light" || saved === "dark"
            ? saved
            : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="stylesheet" href="/main.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="app" class="app">
      <div class="pad" id="boot">
        <div class="skel" style="height: 40px; max-width: 320px; margin-top: 40px"></div>
      </div>
    </div>
    <noscript>Pixora 需要启用 JavaScript 才能使用。</noscript>
    <script type="module" src="/main.js"></script>
  </body>
</html>
