# Pixora 单机部署 —— PostgreSQL 版。
#
# ⚠ 状态说明（2026-10）：迁移能建到 26 张表，但运行期还过不了 sqlx Any 驱动的
#   类型映射（SUM 在 PG 返回 NUMERIC）。当前版本请用 SQLite 版，见
#   docs/Pixora-部署方案.md 的「数据库支持现状」。
#
# 用法：
#   1. 同目录放：本文件（重命名成 docker-compose.yml）、Caddyfile、.env
#   2. mkdir -p data pgdata
#   3. docker compose up -d
#   4. 浏览器打开你的域名，走安装向导

services:
  pixora:
    image: ghcr.io/lovefirefly-26710/pixora:latest
    # build:
    #   context: ..
    #   dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PIXORA_DB_DRIVER: postgres
      # 主机名 db 就是下面那个服务的名字，容器之间用服务名互找
      PIXORA_DB_DSN: postgres://pixora:${DB_PASSWORD:?在 .env 里填 DB_PASSWORD}@db:5432/pixora
      PIXORA_DATA_DIR: /data
      PIXORA_BIND: 0.0.0.0:8080
      PIXORA_BASE_URL: ${PIXORA_BASE_URL:?在 .env 里填站点对外地址}
      PIXORA_MASTER_KEY: ${PIXORA_MASTER_KEY:?在 .env 里填 PIXORA_MASTER_KEY}
      PIXORA_TRUST_PROXY: "1"
      PIXORA_WORKERS: "2"
      RUST_LOG: info
    volumes:
      - ./data:/data
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 128M }
    healthcheck:
      test: ["CMD", "/pixora", "--health-probe"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # 小机器上把 PostgreSQL 的默认值压下来，否则它会按机器内存的 1/4 去申请
    command: >
      postgres -c shared_buffers=64MB -c work_mem=4MB
               -c max_connections=50 -c effective_cache_size=128MB
    environment:
      POSTGRES_DB: pixora
      POSTGRES_USER: pixora
      POSTGRES_PASSWORD: ${DB_PASSWORD:?在 .env 里填 DB_PASSWORD}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixora -d pixora"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { memory: 200M }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      PIXORA_DOMAIN: ${PIXORA_DOMAIN:?在 .env 里填域名}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - pixora
    deploy:
      resources:
        limits: { memory: 48M }

volumes:
  caddy_data:
  caddy_config:
