# Pixora 单机部署 —— MySQL 8.0.13+ / MariaDB 版。
#
# ⚠ 状态说明（2026-10）：迁移能建完，但运行期还过不了 sqlx Any 驱动的类型映射
#   （MySQL 的 TEXT 被当成 BLOB、TINYINT 不被识别）。当前版本请用 SQLite 版，
#   见 docs/Pixora-部署方案.md 的「数据库支持现状」。
#
# 用法：
#   1. 同目录放：本文件（重命名成 docker-compose.yml）、Caddyfile、.env
#   2. mkdir -p data mysqldata
#   3. docker compose up -d
#   4. 浏览器打开你的域名，走安装向导

services:
  pixora:
    image: ghcr.io/lovefirefly-26710/pixora:latest
    # build:
    #   context: ..
    #   dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PIXORA_DB_DRIVER: mysql
      # 云上 MySQL 通常要加 SSL 参数：末尾补 ?ssl-mode=REQUIRED
      PIXORA_DB_DSN: mysql://pixora:${DB_PASSWORD:?在 .env 里填 DB_PASSWORD}@db:3306/pixora
      PIXORA_DATA_DIR: /data
      PIXORA_BIND: 0.0.0.0:8080
      PIXORA_BASE_URL: ${PIXORA_BASE_URL:?在 .env 里填站点对外地址}
      PIXORA_MASTER_KEY: ${PIXORA_MASTER_KEY:?在 .env 里填 PIXORA_MASTER_KEY}
      PIXORA_TRUST_PROXY: "1"
      PIXORA_WORKERS: "2"
      RUST_LOG: info
    volumes:
      - ./data:/data
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 128M }
    healthcheck:
      test: ["CMD", "/pixora", "--health-probe"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  db:
    image: mysql:8.4
    restart: unless-stopped
    # 小机器上把 InnoDB 的缓冲池压到 64MB，默认值会吃掉几百兆
    command: >
      --innodb-buffer-pool-size=64M --innodb-log-buffer-size=8M
      --max-connections=50 --performance-schema=OFF
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: pixora
      MYSQL_USER: pixora
      MYSQL_PASSWORD: ${DB_PASSWORD:?在 .env 里填 DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?在 .env 里填 DB_PASSWORD}
    volumes:
      - ./mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 300M }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      PIXORA_DOMAIN: ${PIXORA_DOMAIN:?在 .env 里填域名}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data:/srv/data:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - pixora
    deploy:
      resources:
        limits: { memory: 48M }

volumes:
  caddy_data:
  caddy_config:
