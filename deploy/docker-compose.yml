# Pixora 单机部署 —— SQLite 版（默认，最省事：整站只有一个应用容器 + 一个反代）。
#
# 另外两种数据库的编排是同目录的 docker-compose.postgres.yml 与
# docker-compose.mysql.yml（当前版本尚未适配完成，见 docs/Pixora-部署方案.md）。
#
# 用法：
#   1. 同目录放三样东西：本文件（重命名成 docker-compose.yml）、Caddyfile、.env
#      （.env 照 deploy/.env.example 抄，填 PIXORA_DOMAIN / PIXORA_BASE_URL /
#       PIXORA_MASTER_KEY）
#   2. mkdir -p data
#   3. docker compose up -d
#   4. 浏览器打开你的域名，走安装向导
#
# 没有域名、或前面已有别的反代：把 caddy 整段删掉，给 pixora 加
# `ports: ["8080:8080"]`，PIXORA_BASE_URL 填实际访问地址。

services:
  pixora:
    image: ghcr.io/lovefirefly-26710/pixora:latest
    # 想从源码现编就用这两行替换上面那行 image
    # build:
    #   context: ..
    #   dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      # ---------- 数据库：SQLite，文件落在数据目录里 ----------
      PIXORA_DB_DRIVER: sqlite
      PIXORA_DB_DSN: /data/pixora.db
      # ---------- 数据与站点 ----------
      PIXORA_DATA_DIR: /data
      PIXORA_BIND: 0.0.0.0:8080
      # 站点对外地址：直链、邮件里的链接都按它拼。写错的表现是「页面能开、图全裂」
      PIXORA_BASE_URL: ${PIXORA_BASE_URL:?在 .env 里填站点对外地址}
      # 主密钥：加密存储后端凭据与 SMTP 密码。丢了它只能重新填一遍
      PIXORA_MASTER_KEY: ${PIXORA_MASTER_KEY:?在 .env 里填 PIXORA_MASTER_KEY}
      # 前面有反向代理时保持 1：只信最靠近服务端的一层转发头
      PIXORA_TRUST_PROXY: "1"
      PIXORA_WORKERS: "2"
      RUST_LOG: info
    volumes:
      - ./data:/data          # 数据库、图片、主密钥都在这里，备份就是备份它
    expose:
      - "8080"
    deploy:
      resources:
        limits: { memory: 128M }
    healthcheck:
      test: ["CMD", "/pixora", "--health-probe"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # 反向代理 + 自动 https 证书。平台自带 https 时整段删掉
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      PIXORA_DOMAIN: ${PIXORA_DOMAIN:?在 .env 里填域名}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data:/srv/data:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - pixora
    deploy:
      resources:
        limits: { memory: 48M }

volumes:
  caddy_data:
  caddy_config:
